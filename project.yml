# Alternativa: genera el proyecto con XcodeGen (`brew install xcodegen && xcodegen`)
name: Viaje
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Viaje:
    type: application
    platform: iOS
    sources: [Viaje]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.viaje
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Viaje
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Para mostrar tu ubicación en el mapa del viaje."
        TARGETED_DEVICE_FAMILY: "1,2"
